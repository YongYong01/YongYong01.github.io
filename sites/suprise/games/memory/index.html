<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wanderer Memory Puzzle</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
    </head>
    
    
<body>
    <h1>Ei want to test your memory</h1>
    <div class="timer">Time: <span id="time">0</span> seconds</div>
    <div class="game-board">
        <div class="card" data-location="1"></div>
        <div class="card" data-location="2"></div>
        <div class="card" data-location="3"></div>
        <div class="card" data-location="4"></div>
        <div class="card" data-location="5"></div>
        <div class="card" data-location="6"></div>
        <div class="card" data-location="7"></div>
        <div class="card" data-location="8"></div>
        <div class="card" data-location="1"></div>
        <div class="card" data-location="2"></div>
        <div class="card" data-location="3"></div>
        <div class="card" data-location="4"></div>
        <div class="card" data-location="5"></div>
        <div class="card" data-location="6"></div>
        <div class="card" data-location="7"></div>
        <div class="card" data-location="8"></div>
    </div>
    <div id="game-end-message" style="display: none; font-size: 20px; color: #4CAF50; margin-top: 20px;"></div>

    <button id="play-again" onclick="resetGame()" style="display: none;">Play Again</button>
    <script src="script.js"></script>
</body>
</html>
