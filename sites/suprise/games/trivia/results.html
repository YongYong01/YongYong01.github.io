<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Results Box with Music Control -->
        <div id="results-container">
            <h2>Quiz Results</h2>
            <p id="result-message"></p>
            <p id="score"></p>
            <p id="percentage"></p>

            <!-- Certificate Download Button, hidden by default -->
            <div id="certificate-container" style="display: none;">
                <a href="certificate/Certificate.pdf" download>
                    <button class="download-btn">Download Certificate</button>
                </a>
            </div>

            <!-- Flex container for buttons -->
            <div class="button-container">
                <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
            </div>

            <!-- Music Toggle Button (Fixed Position) -->
            <button class="music-toggle-btn" onclick="toggleMusic()">🎵</button>

            <!-- Audio Element for Looping Music -->
            <audio id="thinking-music" loop>
                <source src="sounds/GracieGrace.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <script>
        // Retrieve URL parameters for score and percentage
        const urlParams = new URLSearchParams(window.location.search);
        const score = urlParams.get('score');
        const percentage = urlParams.get('percentage');

        // References to elements
        const resultMessage = document.getElementById('result-message');
        const scoreDisplay = document.getElementById('score');
        const percentageDisplay = document.getElementById('percentage');
        const certificateContainer = document.getElementById('certificate-container');
        const music = document.getElementById('thinking-music');

        // Display results based on score and percentage
        if (score !== null && percentage !== null) {
            scoreDisplay.textContent = `You answered ${score} questions correctly.`;
            percentageDisplay.textContent = `That's ${percentage}%`;

            // Display custom messages based on percentage
            if (percentage == 100) {
                resultMessage.textContent = "Your name must be Salima! You know everything about Wanderer!";
                certificateContainer.style.display = "block"; // Show certificate download button
            } else if (percentage >= 70) {
                resultMessage.textContent = "Your name must be Salima! Great job! You're well on your way to mastering Wanderer's lore!";
                certificateContainer.style.display = "block"; // Show certificate download button
            } else if (percentage >= 50) {
                resultMessage.textContent = "Not bad! But there's more to learn about Wanderer!";
            } else if (percentage >= 30) {
                resultMessage.textContent = "You know some of the basics, but keep studying to improve!";
            } else {
                resultMessage.textContent = "It seems Wanderer’s mysteries still elude you. Time to hit the books!";
            }
        } else {
            resultMessage.textContent = "Error retrieving results. Please try again.";
        }

        // Set initial playback state based on localStorage
        const isMusicPlaying = localStorage.getItem('isMusicPlaying') === 'true';
        if (isMusicPlaying) {
            music.play();
        }

        // Toggle music playback and save state to localStorage
        function toggleMusic() {
            if (music.paused) {
                music.play();
                localStorage.setItem('isMusicPlaying', 'true'); // Save state
            } else {
                music.pause();
                localStorage.setItem('isMusicPlaying', 'false'); // Save state
            }
        }

        function restartQuiz() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
