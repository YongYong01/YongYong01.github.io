<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Made by legendary Kevin fuer Samila -->
    <!-- I know ugly code, HTML, CSS and JS in one File -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gugus</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .message {
            font-size: 24px;
            color: #333;
            margin: 20px 0;
            text-align: center;
            z-index: 5;
            position: relative;
        }

        .locked-message {
            font-size: 30px;
            color: white;
            text-align: center;
            display: none;
        }

        .countdown {
            font-size: 40px;
            color: white;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .locked-message img {
            width: 300px; /* Adjust the size of the image here */
            margin-top: 20px;
        }

        .content {
            display: none;
            text-align: center; /* Centers the button and elements */
        }

        .points-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px; /* Adjusted font size */
            color: #ff6b6b;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .points-display img {
            width: 25px;
            height: 25px;
            margin-left: 10px;
        }

        .airplane {
            width: 100px;
            position: absolute;
            top: 30%;
            left: -100px;
            animation: fly-natural 8s ease-in-out infinite;
            z-index: 5;
        }

        .wanderer-flying {
            width: 100px;
            position: absolute;
            top: 50%;
            left: -100px;
            animation: fly-natural-wanderer 12s ease-in-out infinite;
            z-index: 5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Speed up Wanderer */
        .wanderer-speed-up {
            animation: fly-natural-wanderer 6s ease-in-out infinite; /* Faster speed */
        }

        /* Explosion Animation */
        .explode {
            transform: scale(3); /* Scale up the Wanderer for explosion effect */
            opacity: 0; /* Fade out */
        }

        /* Celebration GIF */
        .celebration-gif {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px; /* Adjust the size of the first GIF */
            z-index: 20;
        }

        /* Second GIF for 320 Points */
        .second-celebration-gif {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px; /* Adjust the size of the second GIF */
            z-index: 20;
        }

        @keyframes fly-natural {
            0% {
                left: -100px;
                top: 30%;
                transform: rotate(0deg);
            }
            25% {
                top: 25%;
                transform: rotate(-5deg);
            }
            50% {
                left: 50vw;
                top: 35%;
                transform: rotate(5deg);
            }
            75% {
                top: 40%;
                transform: rotate(-5deg);
            }
            100% {
                left: 100vw;
                top: 30%;
                transform: rotate(0deg);
            }
        }

        @keyframes fly-natural-wanderer {
            0% {
                left: -100px;
                top: 50%;
                transform: rotate(0deg);
            }
            25% {
                top: 45%;
                transform: rotate(-5deg);
            }
            50% {
                left: 50vw;
                top: 55%;
                transform: rotate(5deg);
            }
            75% {
                top: 60%;
                transform: rotate(-5deg);
            }
            100% {
                left: 100vw;
                top: 50%;
                transform: rotate(0deg);
            }
        }

        button {
            padding: 12px 20px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            z-index: 5;
            margin-top: 40px;
            display: inline-block; /* Keeps it in the center */
        }

        button:hover {
            background-color: #ff8b8b;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            z-index: 5;
        }

        .cloud:before,
        .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud1 {
            width: 100px;
            height: 60px;
            top: 20%;
            left: 5%;
            animation: float 8s infinite linear;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 25px;
        }

        .cloud1:after {
            width: 50px;
            height: 50px;
            top: -10px;
            right: 25px;
        }

        .cloud2 {
            width: 120px;
            height: 70px;
            top: 50%;
            left: 50%;
            animation: float 12s infinite linear;
        }

        .cloud2:before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 30px;
        }

        .cloud2:after {
            width: 60px;
            height: 60px;
            top: -15px;
            right: 30px;
        }

        .cloud3 {
            width: 150px;
            height: 80px;
            top: 70%;
            left: 20%;
            animation: float 10s infinite linear;
        }

        .cloud3:before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 35px;
        }

        .cloud3:after {
            width: 70px;
            height: 70px;
            top: -20px;
            right: 35px;
        }

        @keyframes float {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(100vw);
            }
        }

        /* Wanderer Emote Styles */
        .wanderer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s ease-in-out;
            z-index: 10; /* Higher z-index to appear in front of text */
        }

        .wanderer.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        .wanderer.hide {
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- Locked Message -->
    <div class="locked-message" id="locked-message">
        Salimaaaa this site will be available in:
        <div class="countdown" id="countdown"></div>
        <!-- Add image below the countdown -->
        <img src="https://media.tenor.com/_8fcjpUeHnQAAAAi/wanderer-mini-durin.gif" alt="WandererPrank">
    </div>

    <!-- Content -->
    <div class="content" id="content">
        <div class="message" id="flight-message">
            <p>Heyyy Salima,</p>
            <p>I hope you have a safe and smooth flight tomorrow!</p>
            <p>I'm already so excited to hear about all the adventures you're about to have.</p>
            <p>Take care of yourself, and let me know you've arrived safely ✈️❤️</p>
        </div>

        <!-- Airplane -->
        <img src="https://cdn-icons-png.flaticon.com/512/7893/7893979.png" class="airplane" alt="Wanderer Airplane">

        <!-- Flying Wanderer -->
        <img src="images/WandererFlying.png" class="wanderer-flying" id="flying-wanderer" onclick="explodeWanderer(this)" alt="Flying Wanderer">

        <!-- Cloud Elements -->
        <div class="cloud cloud1" onclick="collectPoints(this)"></div>
        <div class="cloud cloud2" onclick="collectPoints(this)"></div>
        <div class="cloud cloud3" onclick="collectPoints(this)"></div>

        <!-- Button -->
        <button onclick="showRandomEmote()">Click me for a surprise!</button>

        <!-- Button for Hub link -->
        <a href="https://n.ethz.ch/~kfrunz/sites/suprise/games/navigate/index.html" target="_blank">
            <button>Go to Hub</button>
        </a>

        <!-- Wanderer Emote -->
        <img id="wanderer" class="wanderer" src="">

        <!-- Celebration GIF at 160 Points -->
        <img id="celebration-gif" class="celebration-gif" src="https://media1.tenor.com/m/af8RmPBBt6MAAAAd/qiqi-dies.gif" alt="Qiqi">

        <!-- Second Celebration GIF at 320 Points -->
        <img id="second-celebration-gif" class="second-celebration-gif" src="https://media1.tenor.com/m/BrHUK514wF0AAAAd/mae-brucelee100.gif" alt="Second Celebration">

        <!-- Points Display -->
        <div class="points-display">
            <span id="points">0</span>
            <img src="https://game-cdn.appsample.com/gim/icons/primogem-200.png" alt="points symbol">
        </div>
    </div>

    <script>
        let points = 0; // Initialize points

        // Function to check date and unlock content on November 2nd
        function checkDate() {
            const currentDate = new Date();
            const unlockDate = new Date('2024-11-01');

            if (currentDate >= unlockDate) {
                document.getElementById('content').style.display = 'block';
                document.getElementById('locked-message').style.display = 'none';
            } else {
                document.getElementById('content').style.display = 'none';
                document.getElementById('locked-message').style.display = 'block';
                startCountdown(unlockDate);
            }
        }

        // Countdown function
        function startCountdown(unlockDate) {
            const countdownElement = document.getElementById('countdown');

            const interval = setInterval(() => {
                const currentDate = new Date().getTime();
                const timeDifference = unlockDate.getTime() - currentDate;

                // Time calculations for days, hours, minutes, and seconds
                const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

                // Display the result in the countdown element
                countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;

                // Show the countdown element
                countdownElement.style.display = 'block';

                // If the countdown is over, stop the timer
                if (timeDifference < 0) {
                    clearInterval(interval);
                    countdownElement.innerHTML = "The wait is over!";
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('locked-message').style.display = 'none';
                }
            }, 1000);
        }

        // Run the checkDate function on page load
        window.onload = checkDate;

        function collectPoints(cloud) {
            points += 1;
            document.getElementById('points').innerText = points;

            resetCloudPosition(cloud);
            checkPoints();
        }

        // Explode Wanderer and reset
        function explodeWanderer(wanderer) {
            points += 20;
            document.getElementById('points').innerText = points;

            // Add 'explode' class to simulate explosion
            wanderer.classList.add('explode');

            // Reset after 500ms (or after the explosion effect)
            setTimeout(() => {
                wanderer.classList.remove('explode');
                resetCloudPosition(wanderer);
            }, 500);

            checkPoints(); // Check points for GIFs and speed up
        }

        function resetCloudPosition(element) {
            const randomLeft = Math.random() * 100; // Between 0% and 100%
            const randomTop = Math.random() * 80;  // Between 0% and 80% of the screen
            element.style.left = randomLeft + "%";
            element.style.top = randomTop + "%";

            element.style.transform = "scale(1.2)";
            setTimeout(() => {
                element.style.transform = "scale(1)"; // Reset scale after click
            }, 500);
        }
        
        let celebrationTriggered160 = false;
        let celebrationTriggered320 = false;

        // Check points for special effects
        function checkPoints() {
            if (points >= 160 && points < 320 && !celebrationTriggered160) {

                celebrationTriggered160 = true;

                // Show first celebration GIF
                const gif = document.getElementById('celebration-gif');
                gif.style.display = 'block';

                // Speed up Wanderer
                const wanderer = document.getElementById('flying-wanderer');
                wanderer.classList.add('wanderer-speed-up');

                // Hide GIF after 8 seconds
                setTimeout(() => {
                    gif.style.display = 'none';
                }, 8100);
            }

            if (points >= 320 && !celebrationTriggered320) {

                celebrationTriggered160 = true;

                // Show second celebration GIF
                const secondGif = document.getElementById('second-celebration-gif');
                secondGif.style.display = 'block';

                // Hide second GIF after 5 seconds
                setTimeout(() => {
                    secondGif.style.display = 'none';
                }, 5000);
            }
        }

        const emotes = [
            "https://media.tenor.com/EGaqu3rgp3cAAAAi/wanderer-genshin-wanderer.gif",
            "https://media.tenor.com/xbUijB9F5aIAAAAi/wanderer-genshin-wanderer.gif",
            "https://media.tenor.com/V9ceVtvOXqoAAAAi/wanderer-genshin-wanderer.gif",
            "https://media.tenor.com/5mXQhlup1xkAAAAi/wanderer-genshin-wanderer.gif",
            "https://media.tenor.com/TvMvUzlv9NcAAAAi/wanderer-genshin-impact.gif",
            "https://media.tenor.com/ffj_ZPCRdA4AAAAM/scaramouche-genshin.gif",
            "https://media.tenor.com/17jVsRIVYiEAAAAi/wanderer-genshin-impact.gif"
        ];

        function showRandomEmote() {
            const wanderer = document.getElementById("wanderer");
            const randomEmote = emotes[Math.floor(Math.random() * emotes.length)];
            wanderer.src = randomEmote;
            wanderer.classList.add("show");
            wanderer.classList.remove("hide");

            setTimeout(() => {
                wanderer.classList.add("hide");
                wanderer.classList.remove("show");
            }, 3000);
        }
    </script>

</body>
</html>
