<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Income Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Swiss Income Calculator</h1>
            <p>Convert between hourly and monthly earnings in CHF</p>
        </header>

        <main>
            <section class="input-section glass-card">
                <div class="toggle-container">
                    <button class="toggle-btn active" id="hourly-toggle">Hourly Rate</button>
                    <button class="toggle-btn" id="monthly-toggle">Monthly Salary</button>
                </div>

                <div class="input-group" id="hourly-input-group">
                    <label for="hourly-wage">Hourly Wage (CHF)</label>
                    <input type="number" id="hourly-wage" step="0.10" min="0" placeholder="e.g. 25.50">
                </div>

                <div class="input-group hidden" id="monthly-input-group">
                    <label for="monthly-salary">Monthly Salary (CHF)</label>
                    <input type="number" id="monthly-salary" step="100" min="0" placeholder="e.g. 6500">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="hours-per-week">Hours/Week</label>
                        <input type="number" id="hours-per-week" value="42" min="0" max="168">
                    </div>
                    <div class="input-group">
                        <label for="days-per-week">Days/Week</label>
                        <input type="number" id="days-per-week" value="5" min="1" max="7">
                    </div>
                </div>

                <div class="input-group">
                    <label for="vacation-weeks">Vacation Weeks/Year</label>
                    <input type="number" id="vacation-weeks" value="5" min="0" max="52">
                </div>
                <!--
                <button class="calculate-btn" onclick="calculateIncome()">
                    <span>Calculate</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                -->
            </section>

            <section class="results-section glass-card">
                <h2>Your Earnings</h2>
                <div class="results-grid">
                    <div class="result-card">
                        <h3>Daily</h3>
                        <p id="daily-income">0.00 CHF</p>
                    </div>
                    <div class="result-card">
                        <h3>Weekly</h3>
                        <p id="weekly-income">0.00 CHF</p>
                    </div>
                    <div class="result-card">
                        <h3>Monthly</h3>
                        <p id="monthly-income">0.00 CHF</p>
                    </div>
                    <div class="result-card">
                        <h3>Yearly</h3>
                        <p id="yearly-income">0.00 CHF</p>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="incomeChart"></canvas>
                </div>
            </section>

            <section class="comparison-section glass-card">
                <h2>Swiss Salary Benchmarks</h2>
                <div class="comparison-grid">
                    <div class="comparison-item">
                        <h3>Minimum Wage</h3>
                        <p>~3,800 CHF/month</p>
                        <div class="progress-bar">
                            <div class="progress-fill" id="min-wage-progress"></div>
                        </div>
                    </div>
                    <div class="comparison-item">
                        <h3>Median Salary</h3>
                        <p>~6,500 CHF/month</p>
                        <div class="progress-bar">
                            <div class="progress-fill" id="median-progress"></div>
                        </div>
                    </div>
                    <div class="comparison-item">
                        <h3>High Salary</h3>
                        <p>~10,000 CHF/month</p>
                        <div class="progress-bar">
                            <div class="progress-fill" id="high-progress"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
